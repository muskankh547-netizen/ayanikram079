<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="1"/>
      <stop offset="45%" stop-color="#0066ff" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#0b132b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="#050814" />
  
  <!-- Outer Ring with Arc Ticks -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00f3ff" stroke-opacity="0.2" stroke-width="3" stroke-dasharray="12 8" />
  <circle cx="256" cy="256" r="185" fill="none" stroke="#00f3ff" stroke-opacity="0.4" stroke-width="4" stroke-dasharray="80 20 40 20" />
  
  <!-- Rotating Hexagon Guide -->
  <polygon points="256,90 395,170 395,330 256,410 117,330 117,170" fill="none" stroke="#00f3ff" stroke-opacity="0.3" stroke-width="2" />

  <!-- Core Glow Disc -->
  <circle cx="256" cy="256" r="120" fill="url(#coreGlow)" filter="url(#glow)" />
  
  <!-- Inner Reactor Ring -->
  <circle cx="256" cy="256" r="90" fill="none" stroke="#00f3ff" stroke-width="8" filter="url(#glow)" />
  <circle cx="256" cy="256" r="60" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.9" />

  <!-- Holographic MIRROR AI 'M' Motif -->
  <path d="M 196 310 L 196 205 L 256 265 L 316 205 L 316 310" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Quantum Orbit Nodes -->
  <circle cx="256" cy="71" r="9" fill="#00f3ff" filter="url(#glow)" />
  <circle cx="416" cy="163" r="7" fill="#00f3ff" />
  <circle cx="416" cy="349" r="7" fill="#00f3ff" />
  <circle cx="256" cy="441" r="9" fill="#00f3ff" filter="url(#glow)" />
  <circle cx="96" cy="349" r="7" fill="#00f3ff" />
  <circle cx="96" cy="163" r="7" fill="#00f3ff" />
</svg>
